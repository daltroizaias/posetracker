version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"  # Alterado para a porta padrão do React
    restart: unless-stopped
    volumes:
      - ./:/app       # Monta o código fonte para desenvolvimento
      - /app/node_modules  # Mantém as dependências isoladas
    environment:
      - CHOKIDAR_USEPOLLING=true  # Melhora o watch de arquivos no Docker
      - WDS_SOCKET_PORT=0         # Corrige hot reload
    command: sh -c "npm install && npm start"  # Desenvolvimento